name: Release Validation

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm
      - name: Check tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi
      - run: npm ci
      - run: npm run verify
      - run: npm run benchmark
      # Parity with upstream Python YAKE is part of release validation
      # (docs/audits/testing-best-practices-2026-04-16.md).
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: scripts/setup-python-parity.sh
      - run: npm run test:python-parity
        env:
          YAKET_REQUIRE_PYTHON_REFERENCE: "1"
