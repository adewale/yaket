name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Mutation testing runs every Sunday at 06:00 UTC. The `mutation` job
    # below gates itself on `schedule` so the cron only triggers the slow
    # job; regular pushes/PRs continue to skip it.
    - cron: '0 6 * * 0'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run benchmark

  python-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: git clone --depth 1 https://github.com/INESCTEC/yake.git /tmp/yake
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy networkx segtok jellyfish
      - run: npx vitest run test/python-parity.test.ts

  cli-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:cli:coverage

  mutation:
    # Mutation testing is expensive (multi-minute). Run it on demand and
    # automatically every Sunday so survivors do not pile up between manual
    # invocations. The Stryker `break` threshold (85%) fails the job if any
    # tracked file falls below it, so a weekly green run is the cadence
    # guarantee TODO #4 used to track manually.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:mutation
