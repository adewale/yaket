name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run benchmark

  python-parity:
    runs-on: ubuntu-latest
    env:
      YAKE_REFERENCE_SHA: f7944f645106d8c37c6999a1ba66d222f215a151
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Check out pinned Python YAKE reference
        run: |
          git init /tmp/yake
          git -C /tmp/yake remote add origin https://github.com/INESCTEC/yake.git
          git -C /tmp/yake fetch --depth 1 origin "$YAKE_REFERENCE_SHA"
          git -C /tmp/yake checkout --detach "$YAKE_REFERENCE_SHA"
          echo "YAKE reference: $(git -C /tmp/yake rev-parse HEAD)"
      - name: Install pinned Python oracle dependencies
        run: python -m pip install numpy==2.2.6 networkx==3.4.2 segtok==1.5.11 jellyfish==1.2.0 regex==2024.11.6
      - run: npx vitest run test/python-parity.test.ts test/differential-fuzz.test.ts

  cli-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:cli:coverage

  mutation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:mutation
